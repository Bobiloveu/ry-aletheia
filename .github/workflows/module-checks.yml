name: Module checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - web_console.py
              - autodrive_console/**
              - live_preprocessor/**
              - config/**
              - tasks/**
              - packaging/**
              - build_*.sh
              - pixi.toml
              - pixi.lock
              - tests/**
              - scripts/doctor.sh
              - scripts/doctor.ps1
              - scripts/bootstrap.sh
              - scripts/test-backend.sh
              - docs/development/**
              - README.md
              - PROJECT_OVERVIEW.md
              - AGENTS.md
              - .gitignore
              - .github/workflows/module-checks.yml
            web:
              - frontend/**
              - autodrive_console/web/**
              - scripts/test-web.sh
            mobile:
              - mobile/**
              - scripts/test-mobile.sh
              - scripts/build-mobile.sh
            contracts:
              - shared/contracts/**

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
      - run: pixi run test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
      - run: pixi run frontend-install
      - run: pixi run frontend-check

  mobile-common:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI pins the same SDK version as mobile/.fvmrc via flutter-action.
      # FVM remains the local developer entrypoint; CI must not download a
      # second SDK on a fresh runner with an empty FVM cache.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            dart pub get --enforce-lockfile && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          flutter analyze
          # Local/FVM equivalent: fvm flutter test --exclude-tags golden --concurrency=1 -r compact
          flutter test --exclude-tags golden --concurrency=1 -r compact

  mobile-golden:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            dart pub get --enforce-lockfile && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          # Local/FVM equivalent: fvm flutter test test/debug_ui/gallery_golden_test.dart --concurrency=1 -r compact
          flutter test test/debug_ui/gallery_golden_test.dart --concurrency=1 -r compact

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            dart pub get --enforce-lockfile && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          flutter build apk --debug

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            dart pub get --enforce-lockfile && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          flutter build ios --simulator --debug --no-codesign
