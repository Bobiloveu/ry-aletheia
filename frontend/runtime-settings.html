<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161617" />
    <title>运行配置 · RY Aletheia</title>
    <script>try{const light=localStorage.getItem("ry-aletheia-theme")==="light";document.documentElement.dataset.theme=light?"light":"dark";document.documentElement.style.colorScheme=light?"light":"dark"}catch{}</script>
    <style data-shell-boot>
      html,body,#app{min-height:100%;margin:0;background:#161617;color:#f5f5f7}
      html[data-theme="light"],html[data-theme="light"] body{background:#eef4fb;color:#17283a}
      .mark,.mark svg{width:34px;height:34px;overflow:hidden}
      .bootstrap-screen{min-height:100vh;display:grid;place-content:center;gap:10px;text-align:center;font:13px Inter,"Segoe UI",Arial,sans-serif}
      .bootstrap-screen strong{color:#32d6cf;font-size:18px;letter-spacing:.5px}
      .bootstrap-screen span{color:#8aa0b8;font-size:12px}
    </style>
  </head>
  <body>
    <div id="app"><div class="bootstrap-screen"><strong>RY Aletheia</strong><span>正在加载运行配置…</span></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
