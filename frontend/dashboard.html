<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <title>任务指挥台 · RY Aletheia</title>
    <script>try{const light=localStorage.getItem("ry-aletheia-theme")==="light";document.documentElement.dataset.theme=light?"light":"dark";document.documentElement.style.colorScheme=light?"light":"dark"}catch{}</script>
    <style data-shell-boot>
      html { min-height: 100%; background: #161617; color-scheme: dark; }
      body { min-height: 100dvh; margin: 0; background: #161617; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eef4fb; color-scheme: light; }
      #app { min-height: 100dvh; }
      .mark, .mark svg { width: 34px; height: 34px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
