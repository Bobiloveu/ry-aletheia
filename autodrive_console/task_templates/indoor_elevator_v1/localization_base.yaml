# 针对NCLT的配置
common:
  dataset: "AVIA"
  lidar_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  odom_topic: "/odom_base_test"
  ODOM_topic: "/encoder_test"
  drift_topic: "/drift_status"
  relocalize_service_topic: "/localizer/relocalize"
  elevator_scene_service_topic: "/elevator_scene_proc"
  # lidar_topic: "/livox/p"
  # livox_lidar_topic: "/livox/lidar"

# fasterlio 参数
fasterlio:
  lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 32
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  point_filter_num: 10 # 点云采样参数
  max_iteration: 6 # 最大迭代次数
  filter_size_scan: 0.1 # 对scan进行的降采样
  filter_size_map: 0.1
  lidar_points: true # 是否存在激光点云进行定位
  ivox_grid_resolution: 0.1        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0, 0, 0 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false


g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.50  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨率

system:
  with_loop_closing: true # 是否需要回环检测
  with_ui: false # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: false # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: /opt/ry/data/maps/GK1/P1
  pub_tf: true
  pub_odom: true
  pub_tf_chain: true
  init_pose_source: 1 # 0: default, 1: yaml, 2: extranal
  init_pose:
    x: -0.0
    y: -0.0
    z: 0.4
    roll: 0.0
    pitch: 0.0
    yaw: 1.57

loop_closing:
  loop_kf_gap: 20       # 每隔多少个关键帧检查一次
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 30.0       # 候选帧的最大距离
  ndt_score_th: 1.2     # ndt位姿分值
  with_height: true


### localization ================================================================================================
lidar_loc:
  enable_scan_context_reloc: false
  enable_sc_init_reloc: false
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  icp_skip_num: 3
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 90.0
  grid_search_angle_step: 45
  lidar_loc_odom_th: 0.5
  init_with_fp: false
  min_init_confidence: 0.6
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  wheel_separation:  0.50374
  wheel_radius: 0.09
  loc_on_kf: true
  try_self_extrap: false
  loc_with_roi: true
  roi:
    height_max: 5.0
    height_min: -1.5
    range_max_x: 40
    range_min_x: -40
    range_max_y: 25
    range_min_y: -25
loc_accuracy_evo:
  ndt_accept_score_th: 0.3
  ndt_high_score_th: 0.6
  consecutive_match_suc_th: 2
  consecutive_low_score_th: 5
  smooth_pos_error_th: 0.5
  smooth_yaw_error_th: 3.5
  lio_pos_error_th: 0.5
  lio_yaw_error_th: 3.5
  no_lidar_data_time_th: 1.2
  loc_fail_time_gap_th: 1.0
  init_frame_gap_th: 10
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: false
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: false
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
  map_with_roi: true
  factor_roi: 1.2
  load_ndt_target_dis_th: 5.0
  inv_chunk_size: 0.01
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 0.5
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.2
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.2
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
  log:
    enable_input_stream: true
    enable_graph_snapshot: false
    enable_low_freq_result_stream: false
    enable_high_freq_result_stream: false
    base_dir: "/workspace/lightning_logs"
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1

# Scan Context 重定位参数
scan_context:
  #enable_scan_context_reloc: true  # 是否启用Scan Context重定位
  #enable_sc_init_reloc: true       # 是否在初始化时尝试Scan Context重定位
  save_database_on_exit: false      # 是否在退出时保存数据库
  load_database_on_start: false     # 是否在启动时加载数据库
  database_path: "/home/ry/workspace/robot_ws/src/lightning-lm/data/donghucheng/outdoor_1231/scan_context.bin"  # 默认数据库文件路径（地图切换时会自动生成对应路径）
  pc_num_ring: 20                  # 环的数量（距离离散化）
  pc_num_sector: 60                # 扇区的数量（角度离散化）
  pc_max_radius: 80.0              # 最大检测距离（米）
  sc_dist_thres: 0.15              # Scan Context距离阈值
  lidar_height: 1.73               # 激光雷达高度（米）
  tree_making_period: 50           # 每多少帧重建一次KD树
  num_exclude_recent: 50           # 排除最近多少帧
  num_candidates_from_tree: 10     # KD树候选数量
  search_ratio: 0.1                # 搜索范围比例
