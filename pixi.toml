[workspace]
name = "ry-aletheia"
version = "2.0.0"
description = "RY Aletheia 开发与验证环境"
authors = ["RY Aletheia maintainers"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
# 与目标车 ROS 2 Humble（Ubuntu 22.04）的 Python ABI 保持一致。
python = "3.10.*"
nodejs = "20.*"
cmake = ">=3.22"
ninja = ">=1.11"
cxx-compiler = ">=1.7"
pyinstaller = ">=6,<7"
pytest = ">=8,<9"
pyyaml = ">=6,<7"

[tasks]
frontend-install = { cmd = "npm ci", cwd = "frontend" }
frontend-check = { cmd = "npm run check", cwd = "frontend" }
# macOS 将 /var/folders 映射至 /private/var/folders；现有报告路径边界测试
# 比较字面路径，因此仅在 macOS 固定临时目录的规范前缀。
test = "bash -c 'if [ \"$(uname -s)\" = Darwin ]; then TMPDIR=/private/tmp; export TMPDIR; fi; python -m pytest -q tests'"
test-offline = "bash -c 'if [ \"$(uname -s)\" = Darwin ]; then TMPDIR=/private/tmp; export TMPDIR; fi; python -m pytest -q tests/test_offline_modules.py tests/test_trajectory_integrity.py'"
test-realtime = "python -m pytest -q tests/test_live_observation_realtime.py"
verify = { depends-on = ["test", "frontend-check"] }
vue-preview = "./run_vue_preview.sh"
backend-test = { depends-on = ["test"] }
web-check = { depends-on = ["frontend-check"] }
backend-run = "python web_console.py"

# Windows 没有 Bash 与 POSIX 开发预览脚本。基础测试和前端开发使用等价的
# 原生命令；完整 ROS2 构建、升级 ZIP/DEB 仍只能在目标 Linux 环境执行。
[target.win-64.tasks]
test = "python -m pytest -q tests"
test-offline = "python -m pytest -q tests/test_offline_modules.py tests/test_trajectory_integrity.py"
backend = "python web_console.py"
vue-preview = { cmd = "npm run dev", cwd = "frontend" }
